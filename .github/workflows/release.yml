name: Release

# Triggered by a version tag (v0.1.0). Publishes with an npm trusted publisher
# (OIDC) and provenance, the same way as bloomsight-node: no NPM_TOKEN secret.
# The trusted publisher on npm must name this repository and this workflow file
# exactly (release.yml), or the upload fails with E404 after provenance is signed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write      # create the GitHub release
  id-token: write      # mints the OIDC token npm trusts, and signs provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          # Required so npm knows which registry the OIDC token is for. No
          # NODE_AUTH_TOKEN is set anywhere.
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Node 24.18 bundles 11.16, so this
      # checks rather than upgrades, and fails loudly if .node-version moves to a
      # Node whose npm is too old.
      - name: npm is new enough for trusted publishing
        run: |
          npm -v
          node -e "
            const [a, b, c] = process.argv[1].split('.').map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error('npm ' + process.argv[1] + ' is older than 11.5.1, which trusted publishing needs');
              process.exit(1);
            }" "$(npm -v)"

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run verify:package

      - name: Check the tag matches the version being published
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then echo "::error::tag v$TAG does not match package.json $PKG"; exit 1; fi

      # A prerelease version (1.0.0-rc.1) goes to the `next` dist-tag, so it never
      # becomes `latest` by accident.
      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIST_TAG=latest
          case "$VERSION" in *-*) DIST_TAG=next ;; esac
          npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $PRERELEASE \
            --title "$GITHUB_REF_NAME" \
            --notes "Published to npm as \`@bloomscorp/imagine-node@$VERSION\`. See CHANGELOG.md for what changed."
